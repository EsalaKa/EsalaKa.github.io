name: Repair function graphs

on:
  push:
    paths:
      - '.github/workflows/repair-function-graphs.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force corrected renderer on every Functions lesson
        run: |
          python - <<'PY'
          from pathlib import Path
          folder=Path('functions')
          for p in folder.glob('*.html'):
              if p.name in {'index.html','exponential-functions.html'}:
                  continue
              s=p.read_text(encoding='utf-8')
              for old in ['<script src="function-visuals.js?v=3"></script>','<script src="function-visuals.js"></script>','<script src="graph-renderer-v1.js"></script>','<script src="graph-renderer-v2.js?v=2"></script>']:
                  s=s.replace(old,'')
              if '</body>' in s:
                  s=s.replace('</body>','<script src="graph-renderer-v2.js?v=2"></script></body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Use corrected v2 formula graphs across Functions"
          git push
